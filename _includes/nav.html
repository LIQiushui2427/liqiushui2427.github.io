<nav>
    <h3>Pages</h3>
    <ul>
      {% for page in site.pages %}
        {% if page.path contains 'pages/' and page.title %}
          <li><a href="{{ page.url | relative_url }}">{{ page.title }}</a></li>
        {% endif %}
      {% endfor %}
    </ul>
  
    <h3>Blogs</h3>
    <ul>
      {% for page in site.pages %}
        {% if page.path contains 'blogs/' and page.title %}
          <li><a href="{{ page.url | relative_url }}">{{ page.title }}</a></li>
        {% endif %}
      {% endfor %}
    </ul>
  </nav>
